# Athenas API — local docker-compose.
#
# MVP1 ships one service (the FastAPI app). The CLI tool inside the image
# is also reachable as `docker compose run --rm api athenas ...` (the `athenas`
# console script lives in the venv; `uv` itself is NOT part of the runtime
# image — it only exists in the build stage).
#
# Usage:
#   docker compose up --build            # foreground
#   docker compose up --build -d         # background
#   docker compose logs -f api           # tail logs
#   docker compose down                  # stop + remove containers
#
# URLs (host port 9096 → container port 8000):
#   http://127.0.0.1:9096/               # guided UI (static/index.html)
#   http://127.0.0.1:9096/docs           # OpenAPI (Swagger UI)
#   http://127.0.0.1:9096/health         # health probe
#
# Notes:
# - No `data/` is bundled into the image — mount your own photos via -v if needed.
# - `./outputs` is mounted so any CLI run inside the container can write reports.
# - The container is non-root (UID/GID 1000) and exposes port 8000 internally.
# - Every setting below is interpolated from the host env / the project `.env`
#   (${VAR:-default}), so `.env` always wins over the default shown here.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
    # MediaPipe publishes no linux/aarch64 wheel (upstream dropped it in
    # 0.10.20+), so the image is built for linux/amd64. On Apple Silicon
    # Docker Desktop emulates it via QEMU — it works, just slower.
    platform: linux/amd64
    image: athenas-api:local
    container_name: athenas-api
    restart: unless-stopped
    ports:
      - "9096:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      # Dev defaults. Each value is interpolated from the host env or the
      # project `.env` (${VAR:-default}) — `environment:` beats `env_file:` in
      # Compose, so interpolating here is what makes `.env` authoritative.
      ATHENAS_CORS_ALLOW_ORIGINS: '${ATHENAS_CORS_ALLOW_ORIGINS:-["*"]}'
      ATHENAS_MAX_UPLOAD_SIZE_MB: "${ATHENAS_MAX_UPLOAD_SIZE_MB:-25}"
      ATHENAS_TRICHOLOGY_BG_METHOD: "${ATHENAS_TRICHOLOGY_BG_METHOD:-grabcut}"
      ATHENAS_TRICHOLOGY_DISPLAY_HEIGHT_PX: "${ATHENAS_TRICHOLOGY_DISPLAY_HEIGHT_PX:-800}"
      ATHENAS_TRICHOLOGY_CLAHE_CLIP_LIMIT: "${ATHENAS_TRICHOLOGY_CLAHE_CLIP_LIMIT:-3.0}"
      ATHENAS_DERM_TARGET_HEIGHT_PX: "${ATHENAS_DERM_TARGET_HEIGHT_PX:-600}"
      ATHENAS_DERM_CLAHE_CLIP_LIMIT: "${ATHENAS_DERM_CLAHE_CLIP_LIMIT:-2.0}"
      ATHENAS_DERM_SATURATION_BOOST: "${ATHENAS_DERM_SATURATION_BOOST:-1.2}"
      ATHENAS_AESTHETICS_TARGET_HEIGHT_PX: "${ATHENAS_AESTHETICS_TARGET_HEIGHT_PX:-900}"
      ATHENAS_AESTHETICS_FACE_PADDING_FRAC: "${ATHENAS_AESTHETICS_FACE_PADDING_FRAC:-0.25}"
      ATHENAS_AESTHETICS_WRINKLE_THRESHOLD_PERCENTILE: "${ATHENAS_AESTHETICS_WRINKLE_THRESHOLD_PERCENTILE:-92.0}"
      ATHENAS_AESTHETICS_WRINKLE_KERNEL_LENGTH: "${ATHENAS_AESTHETICS_WRINKLE_KERNEL_LENGTH:-15}"
      ATHENAS_AESTHETICS_WRINKLE_MIN_LINE_LENGTH: "${ATHENAS_AESTHETICS_WRINKLE_MIN_LINE_LENGTH:-12}"
    volumes:
      # CLI output dir (if you ever run the CLI inside the container).
      - ./outputs:/app/outputs
      # Optional: mount your own sample folder instead of building it in.
      # - ./my_samples:/data:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s